services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anveek-store
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      # Persist WhatsApp login credentials so you don't need to rescan QR on container restart
      - ./whatsapp-auth:/app/whatsapp-auth
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
